// App Store Connect provider token for campaign analytics (Analytics → Campaign links). Empty = plain link.
const PT = "";
const qs = new URLSearchParams(location.search);
const campaign = (qs.get("c") || "web").replace(/[^a-z0-9_-]/gi, "").slice(0, 40);
function storeUrl(){
  const u = new URL("https://apps.apple.com/app/apple-store/id6834111364");
  if (PT) { u.searchParams.set("pt", PT); u.searchParams.set("ct", campaign); u.searchParams.set("mt", "8"); }
  return u.toString();
}
function pick(){
  const q = qs.get("lang"); if (q && T[q]) return q;
  try { const s = localStorage.getItem("fk_lang"); if (s && T[s]) return s; } catch(e) {}
  for (const l of navigator.languages || [navigator.language || "de"]) { const k = l.slice(0,2).toLowerCase(); if (T[k]) return k; }
  return "de";
}
function apply(l){
  const t = T[l];
  document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => { const v = t[e.dataset.t]; if (v != null) e.innerHTML = v; });
  const b = document.getElementById("badge"); if (b && !b.src) b.src = "https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg";
  const pb = document.getElementById("playbadge"); if (pb) pb.src = "https://play.google.com/intl/en_us/badges/static/images/badges/" + l + "_badge_web_generic.png";
  document.getElementById("lang").value = l;
  try { localStorage.setItem("fk_lang", l); } catch(e) {}
}
document.getElementById("appstore").href = storeUrl();
document.getElementById("play").href = "https://play.google.com/store/apps/details?id=com.dogukanguler.fahrklar&referrer=" + encodeURIComponent("utm_source=landing&utm_medium=" + campaign + "&utm_campaign=" + campaign);
document.getElementById("lang").addEventListener("change", e => apply(e.target.value));
apply(pick());
</script>
</body>
</html>
